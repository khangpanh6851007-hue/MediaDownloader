name: Deploy Static Content to GitHub Pages

on:
  # Chạy tự động khi có lệnh đẩy code (push) lên nhánh main
  push:
    branches: ["main"]

  # Cho phép bạn bấm nút chạy thủ công (Run workflow) trong tab Actions của GitHub
  workflow_dispatch:

# Phân quyền cần thiết cho GITHUB_TOKEN để thực hiện deploy
permissions:
  contents: read
  pages: write
  id-token: write

# Đảm bảo chỉ có một tiến trình deploy chạy tại một thời điểm
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập trang GitHub Pages
        uses: actions/configure-pages@v4

      - name: Đóng gói tệp (Upload artifact)
        uses: actions/upload-pages-artifact@v3
        with:
          # Trỏ tới thư mục chứa mã nguồn của bạn ('.' là thư mục gốc)
          path: '.'

      - name: Tiến hành Deploy lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
