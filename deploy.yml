name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # Hoặc "master" tùy thuộc vào tên nhánh chính của bạn

  # Cho phép bạn chạy workflow này thủ công từ tab Actions
  workflow_dispatch:

# Đặt quyền cho GITHUB_TOKEN để cho phép triển khai lên GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Chỉ cho phép một lần triển khai đồng thời, bỏ qua các lượt chạy đang chờ giữa chừng
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Tải lên toàn bộ thư mục gốc chứa file index.html
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
